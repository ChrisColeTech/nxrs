# play.py scenarios: one per library title. Goal (owner's bar): past the intro videos into first gameplay, a
# short stretch of play with screenshots, then quit. `title` is the launcher library's title; `window` is the
# stretch of seconds the report's FPS numbers cover; `fps` the target. Step grammar: see play.py.
# Old long-run variants (11-25 min memory trends) were dropped on purpose; add one only for a specific bug.

[wonder]
title = "Super Mario Bros Wonders"
about = "A through the opening to the first course, run and jump"
seconds = 240
window = [115, 230]
steps = ["wait 25", "shot boot", "press A ; 4 * 20", "wait 3", "shot course",
         "replay wonder_gameplay.txt ; 20", "shot gameplay", "wait 40", "shot gameplay later", "wait 30", "shot end"]

[dkb]
title = "Donkey Kong Bananza"
about = "Continue, walk and punch"
seconds = 200
window = [100, 150]
steps = ["wait 75", "shot boot", "press A ; 6", "press A ; 25", "shot continue",
         "replay dkb_walk.txt ; 14", "shot walk", "replay dkb_punch.txt ; 6", "shot punch",
         "replay dkb_walk.txt ; 14", "shot walk again", "replay dkb_punch.txt ; 6", "shot punch tutorial",
         "wait 6", "shot end"]

[mkw]
title = "Mario Kart World"
about = "unskippable opening, title, A through Grand Prix 50cc to Mario Bros. Circuit, drive"
# Fresh save: the opening plays ~138 s whatever is pressed (L+R does not skip it); A starts at the title too.
# A every 6 s then takes the defaults: Single Player, Grand Prix, Mario, kart, Mushroom Cup 50cc, OK; the race
# grid is up by ~232 s (build/play/20261124-164514-explore1). Extra A presses are harmless (A accelerates).
seconds = 360
window = [250, 325]
steps = ["wait 40", "shot boot", "press A ; 6 * 16", "shot title", "press A ; 6 * 3", "shot menus",
         "press A ; 6 * 15", "shot grid", "replay mkw_drive.txt ; 42", "shot race",
         "replay mkw_drive.txt ; 42", "shot race later"]

