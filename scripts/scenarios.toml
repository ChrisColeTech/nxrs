[oot]
title = "The Legend of Zelda Ocarina of Time"
about = "fresh save: title, New Game, the opening, Kokiri Forest's Deku Tree talk, Navi's flight, Link woken, walk"
# Fresh save: the title is up by ~25 s (with the pipeline cache; a cold compile of the NDVE upscaler d15370a382630d4e
# takes ~60 s first); A on "New Game" starts the opening at once (no file menu). The opening (story tapestry, Link's
# nightmare, his house, the title card) does not skip and A does not hurry it; Kokiri Forest loads at ~330-345 s
# (one 6 s stall) and the Deku Tree / Navi talk advances with A. Navi then flies over the village to Link's house
# and into Link's house, wakes him and he dresses; the dialogue moves one line per A, so A every 1.5 s from 565 s.
# Link is under control in his house ("Move / Change View") by 600-800 s (OOT-FOREST2:
# build/play/20261125-192048-oot-f2-final, -184737-oot-f2-route2); the window is three walk squares in the house.
seconds = 935
window = [845, 915]
fps = 59
steps = ["wait 25", "shot title", "press A ; 3 * 25", "shot story", "press A ; 3 * 25", "shot nightmare",
         "press A ; 3 * 25", "shot house", "press A ; 3 * 25", "shot forest load", "press A ; 3 * 10",
         "shot deku tree", "press A ; 3 * 10", "shot navi", "press A ; 3 * 10", "shot end",
         "press A ; 3 * 10", "shot x1", "press A ; 3 * 10", "shot x2", "press A ; 3 * 10", "shot x3",
         "press A ; 3 * 10", "shot x4", "press A ; 3 * 10", "shot x5",
         "press A ; 1.5 * 20", "shot h1", "press A ; 1.5 * 20", "shot h2", "press A ; 1.5 * 20", "shot h3",
         "press A ; 1.5 * 20", "shot h4", "press A ; 1.5 * 20", "shot h5", "press A ; 1.5 * 20", "shot h6",
         "press A ; 1.5 * 20", "shot h7", "replay oot_house_walk.txt ; 3", "shot walk1", "wait 6", "shot walk2", "wait 6", "shot walk3",
         "wait 9", "replay oot_house_walk.txt ; 3", "shot walk4", "wait 6", "shot walk5", "wait 6",
         "shot walk6", "wait 9", "replay oot_house_walk.txt ; 3", "shot walk7", "wait 6", "shot walk8",
         "wait 6", "shot walk9", "wait 9", "shot last"]

