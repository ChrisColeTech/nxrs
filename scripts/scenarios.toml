[arceus]
title = "Pokemon Legends Arceus (1G+1U)"
about = "fresh save: A through language, Arceus' questions, the fall and Laventon to Prelude Beach, walk"
# A every 3 s takes every default (English, the first look, Yes, the first answer; the name is NXOS_SWKBD's).
# The fall ends in the title card and a ~40 s load (~250-290 s); Laventon's beach talk runs to "Wait, you
# three!", after which the player moves (Move / Dash prompt), ~370-400 s with A every 3 s (each press step
# takes ~3.16 s; the opening's loader stalls vary, 5-20 s; build/play/20261125-043927-xarc, -045023-arceus-fresh,
# -051356-arceus-base-alone). A there does nothing. The first walk up the path loads the next area ("Prelude
# Beach" banner): one to three ~5 s stalls without a present within ~22 s of the first walk (docs/32 "no
# preemption inside long guest loops"; build/play/20261125-052153-arceus-final), so three walks run before the
# window. The walk is a closed square: further up the path a beeping-object event starts a dialogue.
seconds = 600
window = [485, 504]
fps = 30
steps = ["wait 30", "shot boot", "press A ; 3 * 90", "shot opening", "press A ; 3 * 40", "shot beach",
         "replay arceus_beach_walk.txt ; 14 * 3", "shot after banner", "replay arceus_beach_walk.txt ; 1.5",
         "shot walk up", "wait 3", "shot walk right", "wait 3", "shot walk down", "wait 2.5", "shot walk left",
         "wait 4", "replay arceus_beach_walk.txt ; 6", "shot end"]

[arceus-base]
