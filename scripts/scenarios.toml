window = [250, 325]
steps = ["wait 40", "shot boot", "press A ; 6 * 16", "shot title", "press A ; 6 * 3", "shot menus",
         "press A ; 6 * 15", "shot grid", "replay mkw_drive.txt ; 42", "shot race",
         "replay mkw_drive.txt ; 42", "shot race later"]

