# play.py scenarios: one per library title. Goal (owner's bar): past the intro videos into first gameplay, a
# short stretch of play with screenshots, then quit. `title` is the launcher library's title; `window` is the
# stretch of seconds the report's FPS numbers cover; `fps` the target. Step grammar: see play.py.
# A `[<scenario>.checks]` table (`<shot> = "what it shows"`) names route checkpoints: shots of a stable place (not a cutscene moment
# whose timing drifts) compared with a known-good run's (scripts/checkpoints.json, recorded with
# `py scripts/play.py checkpoint <run>` after reading its sheets). A mismatch marks the run OFF-ROUTE, FPS invalid.
# Old long-run variants (11-25 min memory trends) were dropped on purpose; add one only for a specific bug.

[wonder]
title = "Super Mario Bros Wonders"
about = "A through the opening to the first course, run and jump"
seconds = 240
window = [115, 230]
steps = ["wait 25", "shot boot", "press A ; 4 * 20", "wait 3", "shot course",
         "replay wonder_gameplay.txt ; 20", "shot gameplay", "wait 40", "shot gameplay later", "wait 30", "shot end"]

