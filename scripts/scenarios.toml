[plza]
title = "Pokemon Legends Z-A"
about = "fresh save: language/name, first look, Ready!, the arrival to free movement on the station platform, walk"
seconds = 330
window = [215, 300]
# A through the opening to the appearance grid (A alone selects nothing there: the stick highlights a look), then Confirm Choices opens on
# "Change hair color": Down twice to Ready!. A through "You're ready to go!" and the train to the platform, where
