[mkw]
title = "Mario Kart World"
about = "unskippable opening, title, A through Grand Prix 50cc to Mario Bros. Circuit, drive"
# Fresh save: the opening plays ~138 s whatever is pressed (L+R does not skip it); A starts at the title too.
# A every 6 s then takes the defaults: Single Player, Grand Prix, Mario, kart, Mushroom Cup 50cc, OK; the race
# grid is up by ~232 s (build/play/20261124-164514-explore1). Extra A presses are harmless (A accelerates).
seconds = 360
window = [250, 325]
# At ~50 FPS (MKW-HEAVY on) the opening ends well before 138 s and the first 16 presses already take the menus (the
# character select at ~90 s, the race from ~160 s; build/play/20261127-094847-rd-base-pop): each of those screens is
# shot just before the A that leaves it (5.5 s + the shot's 0.5 s keeps the 6 s rhythm, so the route is unchanged).
steps = ["wait 40", "shot boot",
         "press A ; 5.5", "shot o1 ; 0.5", "press A ; 5.5", "shot o2 ; 0.5", "press A ; 5.5", "shot o3 ; 0.5",
         "press A ; 5.5", "shot o4 ; 0.5", "press A ; 5.5", "shot o5 ; 0.5", "press A ; 5.5", "shot o6 ; 0.5",
         "press A ; 5.5", "shot o7 ; 0.5", "press A ; 5.5", "shot o8 ; 0.5", "press A ; 5.5", "shot o9 ; 0.5",
         "press A ; 5.5", "shot o10 ; 0.5", "press A ; 5.5", "shot o11 ; 0.5", "press A ; 5.5", "shot o12 ; 0.5",
         "press A ; 5.5", "shot o13 ; 0.5", "press A ; 5.5", "shot o14 ; 0.5", "press A ; 5.5", "shot o15 ; 0.5",
         "press A ; 5.5", "shot o16 ; 0.5",
         "shot title", "press A ; 6 * 3", "shot menus", "press A ; 6 * 15", "shot grid", "replay mkw_drive.txt ; 42",
         "shot race", "replay mkw_drive.txt ; 42", "shot race later"]
[mkw.checks]
# race shots never land at the same spot of the track (game time drifts with FPS): they check the race HUD
# (coin counter, place badge; play_route.REGION_SETS) instead of the whole frame. The HUD is up from the start grid
# on, and a fast run is already racing at the grid shot (20261125-085542-mkw-perf5-scan4), so the grid checks it too
grid = { about = "race start grid or racing (coin counter, place badge)", regions = "kart-hud" }
race = { about = "in the race (coin counter, place badge)", regions = "kart-hud" }
race_later = { about = "in the race, lap 2 (coin counter, place badge)", regions = "kart-hud" }

