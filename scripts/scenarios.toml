         "wait 4", "replay arceus_beach_walk.txt ; 6", "shot end"]

[violet]
title = "Pokemon Violet"
about = "fresh save: language, a look, A through the opening to the bedroom, get up, walk"
# A takes English; "Choose a look" (up by ~60 s) has no default, so the stick picks one (LUp: the top row's 2nd)
# and A takes it. The name is NXOS_SWKBD's. A then runs the opening (enrolment, director's speech, the academy,
# the region flyover) to the bedroom desk and its "Get Up" (left stick) prompt, ~270 s after the look
# (build/play/20261125-114618-xviolet1: Get Up shown by 474 s with the look picked at ~200 s). After getting up the
# game saves and opens the Adventure Guide: A there opens it again, B closes it, so the A presses stop before.
seconds = 480
window = [425, 452]
fps = 30
steps = ["wait 30", "shot boot", "press A ; 3 * 12", "shot look", "press LUp~0.5 ; 2", "press A ; 3 * 35",
         "shot opening", "press A ; 3 * 35", "shot academy", "press A ; 3 * 35", "shot get up",
         "press LLeft~1.5 ; 8", "shot guide", "press B ; 3", "press B ; 3", "shot bedroom",
         "replay violet_bedroom_walk.txt ; 9", "replay violet_bedroom_walk.txt ; 1.5", "shot walk left",
         "wait 2", "shot walk down", "wait 2", "shot walk right", "wait 3.5", "shot walk up",
         "replay violet_bedroom_walk.txt ; 1.5", "shot walk left 2", "wait 2", "shot walk down 2", "wait 2",
