[shadow]
title = "SONIC X SHADOW GENERATIONS"
about = "Shadow Generations, New Game, intro skipped, boost through Space Colony ARK"
seconds = 240
window = [130, 202]
fps = 30
# The title ("press any button") is sometimes still up at 40 s and sometimes already past to the Sonic / Shadow
# selection, where Left and Right both toggle between the two (so two Rights picked Sonic about half the time).
# R passes the title and does nothing on the selection: two Rs, then exactly one Right, is Shadow either way
# (build/play/20261125-091344-xmenu3). The stage starts ~126 s on a rail that Shadow grinds by himself, where a
# jump leaves the rail into the void (shadow_rail.txt: forward + boost, no jump); dash rings follow. B is the jump
# (A does nothing in a stage: the old run_jump.txt left Shadow standing at the first jump prompt) and B -> Y the
# homing attack: shadow_boost.txt holds forward + boost (ZR) and does both every 1.5 s. ~20-24 s of it reach a
# side-on ledge where forward does nothing: shadow_side.txt steps right off it onto a road that ends at an edge
# (the way on, a grind rail to the right, is not found yet: build/play/20261125-092155-shadow-route2). Shadow
# either falls off the road soon after landing or stands at that edge, where one B jumps him off: either way the
# stage restarts on its first rail and the route runs it again (build/play/20261125-094632-shadow-route3).
steps = ["wait 40", "shot title", "press R ; 5", "press R ; 3", "press Right ; 3", "shot shadow",
         "press A ; 25", "press Down ; 3", "press A ; 20", "press A ; 20", "shot new game",
         "replay skip_hold.txt ; 10", "shot rail", "wait 8", "replay shadow_boost.txt ; 12", "shot run 1",
         "replay shadow_boost.txt ; 12", "shot run 2", "replay shadow_boost.txt ; 4", "shot ledge",
         "replay shadow_side.txt ; 2.6", "shot road", "replay shadow_rail.txt ; 7", "shot edge",
         "replay shadow_boost.txt ; 1.6", "replay shadow_rail.txt ; 12", "shot restart rail", "replay shadow_boost.txt ; 12",
         "shot end"]

[sonic]
title = "SONIC X SHADOW GENERATIONS"
about = "Sonic Generations (successor process), intro skipped, run, jump and spin dash through Green Hill"
seconds = 300
window = [185, 275]
fps = 30
# Green Hill starts ~140-170 s. B is the jump (A does nothing in a stage: the old spindash.txt left Sonic at the
# first rock wall); classic_run_jump.txt spin dashes (down + B) then runs right jumping, replayed back to back
# with the shots between (build/play/20261125-084105-xsonic).
steps = ["wait 40", "shot title", "press A ; 8", "press A ; 45", "shot program 1",
         "replay hold_a.txt ; 8 * 8", "replay classic_run_jump.txt ; 12 * 2",
         "replay classic_run_jump.txt ; 12", "shot run 1", "replay classic_run_jump.txt ; 12", "shot run 2",
         "replay classic_run_jump.txt ; 12", "shot run 3", "replay classic_run_jump.txt ; 12", "shot run 4",
         "replay classic_run_jump.txt ; 12", "shot run 5", "replay classic_run_jump.txt ; 12", "shot run 6",
         "replay classic_run_jump.txt ; 12", "shot run 7", "replay classic_run_jump.txt ; 12", "shot run 8"]

[jamboree]
title = "Super Mario Party Jamboree"
about = "fresh save: unskippable opening, L+R at the title, A through players/character/Toad to the plaza, walk"
# The title ("Press L+R") is up by ~300 s; A then takes 1 player, Mario, Ready! and Toad's first-run talk,
# ending on "hop on the Hot-Air Balloon": Mario walks from ~400 s (build/play/20261125-043913-xjam). A there
# is a jump; walking up the balloon stairs would board it, so the walk keeps to the plaza floor. The walk
# ends where it began: the shots are taken inside it (down, right, left, back up).
seconds = 520
window = [405, 445]
steps = ["wait 305", "shot title", "press L+R~1 ; 5", "shot players", "press A ; 3 * 30", "shot plaza",
         "replay jamboree_walk.txt ; 2.5", "shot walk down", "wait 3", "shot walk right", "wait 4.5",
         "shot walk left", "wait 5", "shot walk up", "wait 3", "replay jamboree_walk.txt ; 5.5",
         "shot walk right again", "wait 12.5", "shot end"]

[smash]
title = "Super Smash Bros Ultimate"
about = "menus to a match vs a CPU, fight; results; a second match (memory between the two)"
# The 2:30 timed match ends at ~285 s; the replay's 20 s blocks (A for results, + + = Ready to Fight at the
# character select) carry on into a second match (Norfair again; the CPU fighter is random, so each match may
# bring new pipelines). `window` is the first match; compare private_mb of metrics-*.csv between the two
# matches for the memory check (SMASH-POLISH).
seconds = 560
window = [130, 280]
steps = ["wait 40", "shot boot", "press A ; 8 * 7", "wait 3", "shot character select",
         "replay smash_fight.txt ; 30", "shot fight", "wait 30", "shot fight later", "wait 30", "shot fight end",
         "wait 100", "shot results", "wait 60", "shot second fight", "wait 60", "shot second fight later",
         "wait 60", "shot second fight end"]

