steps = ["wait 30", "shot boot", "press A ; 3 * 90", "shot opening", "press A ; 3 * 40", "shot beach",
         "replay arceus_beach_walk.txt ; 14 * 3", "shot after banner", "replay arceus_beach_walk.txt ; 1.5",
