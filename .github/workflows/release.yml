# The portable release: dist/nxrs (Windows) and nxrs/ with the Linux launcher and engine, published together as a
# GitHub Release. Runs only on a push to main (owner, 2026-11-26: work is pushed to feature branches, and the release
# is built when it reaches main); the release is tagged build-<UTC date>-<short commit>.
name: Release
on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  RUST_VERSION: '1.99.0'
  # the compiler a release builds games with on a machine without Visual Studio (as ci.yml's gnullvm job); its LLVM
  # (23.1.5) is the one scripts/build/linux-deps.sh bundles for Linux
  LLVM_MINGW: '20261104'
  # the shader translator's nxnative source, as in ci.yml; checked out with core.autocrlf true it gives the shipped
  # tool's --source-sha, which games' shader caches are keyed by
  NXNATIVE_XLATE: 'e4b0d9b75d39c41c10fdcfec2f0b070df496d7e5'
  XLATE_SHA: 'e11dc43d4ddc5b58'

jobs:
  windows:
    name: nxrs-windows-x64.zip
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Rust ${{ env.RUST_VERSION }} + gnullvm target
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal --target x86_64-pc-windows-gnullvm
          rustup default $env:RUST_VERSION
      - name: llvm-mingw ${{ env.LLVM_MINGW }} (ships in the zip as toolchain\llvm-mingw)
        shell: pwsh
        run: |
          $name = "llvm-mingw-$env:LLVM_MINGW-ucrt-x86_64"
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW/$name.zip" -OutFile llvm-mingw.zip
          Expand-Archive llvm-mingw.zip -DestinationPath C:\llvm-mingw-dl
          New-Item -ItemType Directory -Force build\tools | Out-Null
          Move-Item "C:\llvm-mingw-dl\$name" build\tools\llvm-mingw
          & build\tools\llvm-mingw\bin\clang.exe --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Vulkan SDK (spirv-val, glslangValidator)
        shell: pwsh
        run: |
          Invoke-WebRequest https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe -OutFile vulkan-sdk.exe
          Start-Process -Wait -FilePath .\vulkan-sdk.exe -ArgumentList '--root','C:\VulkanSDK','--accept-licenses','--default-answer','--confirm-command','install'
          if (-not (Test-Path C:\VulkanSDK\Bin\spirv-val.exe)) { throw 'Vulkan SDK install failed' }
          "VULKAN_SDK=C:\VulkanSDK" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "NXGFX_GLSLANG=C:\VulkanSDK\Bin\glslangValidator.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: dmsh_xlate (nxnative's shader translator)
        shell: pwsh
        run: |
          git init -q C:\nxnative
          git -C C:\nxnative config core.autocrlf true
          git -C C:\nxnative remote add origin https://github.com/seedds/nxnative.git
          git -C C:\nxnative sparse-checkout set dm/gfx/tools/dmsh_xlate dm/third_party/ryujinx
          git -C C:\nxnative fetch -q --depth 1 --filter=blob:none origin $env:NXNATIVE_XLATE
          git -C C:\nxnative checkout -q FETCH_HEAD
          pwsh src/shaders/tools/build_dmsh_xlate.ps1 -Nxnative C:\nxnative -Out build\tools\dmsh_xlate -Work C:\dmsh_src -Commit $env:NXNATIVE_XLATE
          $sha = (& build\tools\dmsh_xlate\dmsh_xlate.exe --source-sha).Trim()
          if ($sha -ne $env:XLATE_SHA) { throw "dmsh_xlate --source-sha is $sha, expected $env:XLATE_SHA" }
      - name: Build dist/nxrs (MSVC and gnullvm engines, the bundled llvm-mingw)
        shell: pwsh
        run: scripts/build/build.ps1 -Jobs 4
      - name: Check the release answers its contract
        shell: pwsh
        run: dist\nxrs\nxrs-engine\nxrs-build.exe contract
      - name: Check the release builds games without Visual Studio (the bundled llvm-mingw and gnu\)
        # the runner has Visual Studio, so the gnu toolchain is forced; the doctor must find the zip's own compiler and
        # engine (its Vulkan and keys checks fail on a runner, so only these lines are read)
        shell: pwsh
        run: |
          $env:NXRS_TOOLCHAIN = 'gnu'
          $out = & dist\nxrs\nxrs-engine\nxrs-build.exe doctor
          $out
          $dist = (Resolve-Path dist\nxrs).Path
          foreach ($what in 'compiler', 'runtime library', 'engine library') {
            $line = $out | Where-Object { $_ -match "^(ok  |FAIL) $what" }
            if (-not $line -or $line -notmatch '^ok' -or $line -notlike "*$dist*") { throw "doctor: $what is not the release's own: $line" }
          }
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\nxrs -DestinationPath nxrs-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: nxrs-windows-x64
          path: nxrs-windows-x64.zip

  linux:
    name: nxrs-linux-x64.tar.gz
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld cmake pkg-config libvulkan-dev libasound2-dev \
            zlib1g-dev spirv-tools glslang-tools nasm meson ninja-build zstd xz-utils \
            libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Codecs, static (opus, libvpx, dav1d, FFmpeg's H.264 and AAC; built into the engine)
        run: |
          bash scripts/build/linux-deps.sh codecs "$HOME/codecs"
          echo "NXRS_CODECS=$HOME/codecs" >> "$GITHUB_ENV"
      - name: Rust
        run: |
          rustup toolchain install $RUST_VERSION --profile minimal
          rustup default $RUST_VERSION
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Engine release build
        run: |
          export NXGFX_GLSLANG=$(command -v glslangValidator)
          cargo build --release --locked --jobs 4 -p nxrs-cli -p front -p runtime
      - name: Launcher release build
        # its own workspace: its .cargo/config.toml (the root target/) only applies from inside src/launcher
        run: cargo build --release --locked --jobs 4 --manifest-path src/launcher/Cargo.toml --target-dir target
      - name: dmsh_xlate (nxnative's shader translator)
        run: |
          git init -q ~/nxnative && cd ~/nxnative
          git config core.autocrlf true   # the CRLF files the Windows tool was built from: the same --source-sha
          git remote add origin https://github.com/seedds/nxnative.git
          git sparse-checkout set dm/gfx/tools/dmsh_xlate dm/third_party/ryujinx
          git fetch -q --depth 1 --filter=blob:none origin $NXNATIVE_XLATE
          git checkout -q FETCH_HEAD
          cd "$GITHUB_WORKSPACE"
          DMSH_COMMIT=$NXNATIVE_XLATE bash src/shaders/tools/build_dmsh_xlate.sh ~/nxnative build/tools/dmsh_xlate-linux
          sha=$(build/tools/dmsh_xlate-linux/dmsh_xlate --source-sha)
          [ "$sha" = "$XLATE_SHA" ] || { echo "dmsh_xlate --source-sha is $sha, expected $XLATE_SHA"; exit 1; }
      - name: Package nxrs/ (launcher + nxrs-engine/)
        run: |
          python3 -I scripts/package_engine.py --platform linux --target target/release \
            --xlate build/tools/dmsh_xlate-linux/dmsh_xlate --spirv-val "$(command -v spirv-val)" --out dist
          mkdir -p stage/nxrs
          tar -xzf dist/nxrs-engine-linux-x64.tar.gz -C stage/nxrs
          cp target/release/nxrs stage/nxrs/
          stage/nxrs/nxrs-engine/nxrs-build contract
      - name: Bundle the compiler (LLVM's clang + lld and a sysroot) as nxrs/toolchain/clang
        run: bash scripts/build/linux-deps.sh toolchain stage/nxrs/toolchain/clang
      - name: Check the release builds games on a clean system (ubuntu:24.04, no compiler, no -dev packages)
        run: |
          docker run --rm -v "$PWD/stage/nxrs:/nxrs:ro" -v "$PWD/scripts/build:/s:ro" ubuntu:24.04 \
            bash -c 'bash /s/linux-deps.sh check /nxrs && { /nxrs/nxrs-engine/nxrs-build doctor || true; }'
      - name: Package nxrs-linux-x64.tar.gz
        run: tar -czf nxrs-linux-x64.tar.gz -C stage nxrs
      - uses: actions/upload-artifact@v4
        with:
          name: nxrs-linux-x64
          path: nxrs-linux-x64.tar.gz

  publish:
    name: GitHub Release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          gh release create "$tag" out/nxrs-windows-x64.zip out/nxrs-linux-x64.tar.gz -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "nxrs $tag" --generate-notes
