# Temporary (lead, 2026-11-25): find the x86-64 Linux SIGSEGV in the os crate's unit tests. Runs the two decode tests
# that never finished in CI one at a time under gdb and prints the backtrace. Delete once fixed.
name: Debug os on Linux
on:
  workflow_dispatch:

env:
  RUST_VERSION: '1.99.0'
  GLSLANG_VERSION: '15.1.0'

jobs:
  os-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld cmake pkg-config libvulkan-dev libasound2-dev \
            libopus-dev libvpx-dev libdav1d-dev libavcodec-dev libavutil-dev libsdl2-2.0-0 gdb
          dpkg -l libvpx-dev libdav1d-dev libavcodec-dev | tail -3
      - name: Rust
        run: |
          rustup toolchain install $RUST_VERSION --profile minimal
          rustup default $RUST_VERSION
      - name: glslang cache
        id: glslang
        uses: actions/cache@v4
        with:
          path: ~/glslang
          key: glslang-${{ env.GLSLANG_VERSION }}-linux
      - name: Build glslangValidator
        if: steps.glslang.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch $GLSLANG_VERSION https://github.com/KhronosGroup/glslang.git ~/glslang-src
          cmake -S ~/glslang-src -B ~/glslang-build -DCMAKE_BUILD_TYPE=Release -DENABLE_OPT=OFF -DENABLE_HLSL=OFF -DBUILD_TESTING=OFF -DENABLE_GLSLANG_BINARIES=ON
          cmake --build ~/glslang-build --parallel 4
          mkdir -p ~/glslang
          cp ~/glslang-build/StandAlone/glslang ~/glslang/glslangValidator
      - name: cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-linux-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-linux-${{ env.RUST_VERSION }}-
      - name: Build the os tests
        run: |
          export NXGFX_GLSLANG=$HOME/glslang/glslangValidator
          cargo test -p os --lib --locked --jobs 4 --no-run 2>&1 | tail -3
      - name: Each decode test alone, under gdb
        run: |
          bin=$(ls -t target/debug/deps/nxos-* | grep -v '\.d$' | head -1)
          echo "binary: $bin"
          echo "=================== whole binary, one thread, no debugger (the last 'test X ...' is the crasher)"
          timeout 1200 "$bin" --test-threads=1 2>&1 | grep -v 'ALSA lib' | grep -E '^test |test result|signal|panicked' | tail -15 || true
          echo "exit: ${PIPESTATUS[0]}"
          echo "=================== whole binary, default threads, gdb passing the SIGSEGVs the engine handles"
          timeout 1200 gdb -batch -q -ex 'handle SIGSEGV nostop noprint pass' -ex 'handle SIGBUS nostop noprint pass' \
            -ex run -ex 'thread apply all bt 10' --args "$bin" 2>&1 \
            | grep -v '^\[New Thread\|^\[Thread .* exited\]\|ALSA lib' | tail -120 || true
