[package]
name = "os"
edition = "2021"
version = "0.1.0"
license = "MIT"
description = "RecompLauncher engine: the OS services layer (HLE of the SDK's system interfaces, IPC, sm and the services, memory and SVCs)"

[lib]
name = "nxos"
path = "src/lib.rs"
# rlib for tests and the dev tool; staticlib (nxos.lib, which carries the runtime) is what the game executable links.
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "nxos-dev"
path = "src/bin/nxos_dev.rs"

[dependencies]
cpal = "0.18"
lewton = "0.10"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com", "Foundation", "Foundation_Collections", "Devices", "Devices_Bluetooth", "Devices_Bluetooth_Advertisement", "Devices_Bluetooth_GenericAttributeProfile", "Storage", "Storage_Streams"] }
runtime = { path = "../runtime" }
profiles = { path = "../profiles" }
translator = { path = "../translator" }
nxgfx = { package = "graphics", path = "../graphics" }
nxconfig = { package = "config", path = "../config" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_System_Time",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
] }

[[bin]]
name = "nxinput"
path = "src/bin/nxinput.rs"
