[package]
name = "front"
edition = "2021"
version = "0.1.0"
license = "MIT"
description = "RecompLauncher engine: the front end (the game window, hotkeys, keyboard and mouse, the settings file, screenshots, recording, frame generation, the control pipe, metrics) and the game's entry"

[lib]
name = "nxfront"
path = "src/lib.rs"
# staticlib nxfront.lib carries the whole engine (front + os + graphics + runtime): what a game links
crate-type = ["rlib", "staticlib"]

[dependencies]
nxos = { package = "os", path = "../os" }
nxgfx = { package = "graphics", path = "../graphics" }
nxrt = { package = "runtime", path = "../runtime" }
nxconfig = { package = "config", path = "../config" }
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Diagnostics_Debug",
    "Win32_Media",
    "Win32_Security",
    "Win32_Storage_Xps",
    "Win32_System_SystemInformation",
    "Win32_System_Power",
] }
windows = { version = "0.62", features = [
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_System_Variant",
    "Win32_System_Com_StructuredStorage",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# the game window on Linux (X11 / Wayland), as graphics' own host window uses
winit = "0.30"
raw-window-handle = "0.6"
