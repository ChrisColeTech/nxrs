# The nxrs launcher: the game library, builds through nxrs-build (contract v2, a child process) and Play.
# Its own workspace, like src/oracle: never a member of the engine workspace, own Cargo.lock and target/.
[package]
name = "nxrs-launcher"
version = "0.6.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.95"
build = "build.rs"

[workspace]

[[bin]]
name = "nxrs"
path = "src/main.rs"

# answers like nxrs-build (contract, doctor, update-info, dlc sync, build) for the process and CLI tests
[[bin]]
name = "fake-engine"
path = "src/bin/fake_engine.rs"
test = false

[lib]
name = "nxrs_launcher"
path = "src/lib.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.37"
egui_extras = "0.37"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "rayon"] }
rfd = "0.18"
serde_json = "1"
chrono = "0.4.45"
dirs = "7"
uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1"
regex = "1"
clap = { version = "4", features = ["std", "help", "usage", "error-context"], default-features = false }
open = "5"
raw-window-handle = "0.6"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Registry",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
egui_kittest = "0.37"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
