[package]
name = "cli"
edition = "2021"
version = "0.1.0"
license = "MIT"
description = "RecompLauncher engine: the nxrs command line (build, updates, DLC) and the build step (clang, chunk cache, code DLL)"

[[bin]]
name = "nxrs"
path = "src/main.rs"

[dependencies]
translator = { path = "../translator" }
profiles = { path = "../profiles" }
shaders = { path = "../shaders" }
anyhow = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
ash = "0.38"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
