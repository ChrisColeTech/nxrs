[package]
name = "nxrs-cli"
edition = "2021"
version = "0.1.0"
license = "MIT"
description = "RecompLauncher engine: nxrs-build, the command line the launcher runs (build, updates, DLC) and the build step (clang, chunk cache, code DLL)"

[[bin]]
name = "nxrs-build"
path = "src/main.rs"

[dependencies]
translator = { path = "../translator" }
profiles = { path = "../profiles" }
shaders = { path = "../shaders" }
anyhow = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
ash = "0.38"
# WEB-W6: the web build's precompressed modules and compressed data extents (gzip / raw deflate, which browsers decode)
flate2 = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
