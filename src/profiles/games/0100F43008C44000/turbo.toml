# The owner's patches for Pokémon Legends: Z-A, from Turbo (nxloader.py BUILTIN_PATCHES); kept by hand, never
# written by the exporter. nxrs applies them when it builds the game (apply = "build"): the translator lifts the
# replacement and the original both, and the runtime picks one by the set's switch (NXRS_PATCH_ZA_60FPS=0 keeps the
# game's 30). NXRS_NO_PROFILE_PATCHES=1 at build time leaves them out.
source = "Turbo nxloader.py (the owner's built-in patches)"

[[cut]]
build = "b1f12fd919eae86ab8a978317677e64bce443d1f"
module = "main"
offset = 0x1b296d8
original = "3481c039"
replacement = "f4031f2a"
reason = """Pokemon Legends Z-A: base frame rate 60 instead of 30 (ldrsb w20, [x9, #0x20] -> mov w20, wzr). Update 2.0.2: once a frame main+0x1B29660 reads the frame rate the game runs at from its frame-rate settings (the byte at +0x20 of the object at +0x40: 0 FPS60, 1 FPS30, 2 FPS20, 3 FPS15, 4 FPS12, trinity_config's baseFrameRate) and hands it to the window (present interval = value + 1, main+0x17FB5E0). The package's trinity_config.trowc does not set it and the program's own value is FPS30. With FPS60 read there the game steps by measured time as before (falling back to 30, 20... by its own rule when frames take longer) and held 58 to 60 in Turbo."""
apply = "build"
set = "za_60fps"
env = "NXRS_PATCH_ZA_60FPS"
