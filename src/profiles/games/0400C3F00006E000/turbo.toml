# The owner's patches for Mario Kart World, from mkw-recomp (recomp/patches-mkw-180.txt, set "shadow"); kept by hand,
# never written by the exporter. nxrs applies them when it builds the game (apply = "build"): the translator lifts the
# replacement and the original both, and the runtime picks one by the set's switch (NXRS_PATCH_MKW_RBPOOL=0 keeps the
# game's). The two calls go to os `gamefix.rs` (the patch page after main), which fills the second slot.
source = "mkw-recomp recomp/patches-mkw-180.txt (the owner's)"

[[cut]]
