reason = """MKW 1.8.0: bl main+0xeb1870 (agl::utl::DynamicTextureAllocator's init) -> bl patch page + 0xf90 (os gamefix shadow_pool: remembers the allocator, runs the init)"""
apply = "build"
set = "mkw_rbpool"
