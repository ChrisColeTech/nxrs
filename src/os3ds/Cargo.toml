[package]
name = "os3ds"
edition = "2021"
version = "0.1.0"
license = "MIT"
description = "RecompLauncher engine: the 3DS OS services (srv, apt, fs, hid, gsp, dsp, ldr:ro, cfg, ptm, y2r, soc) over runtime3ds"

[lib]
name = "os3ds"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "boot3ds_os"
path = "src/bin/boot3ds_os.rs"

[dependencies]
runtime3ds = { path = "../runtime3ds" }
translator3ds = { path = "../translator3ds" }
