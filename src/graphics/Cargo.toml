[package]
name = "graphics"
edition = "2021"
version = "0.1.0"
license = "MIT"
description = "RecompLauncher engine: NVN on Vulkan (record layer, replay back end, textures, window and present)"
build = "build.rs"

[lib]
name = "nxgfx"
path = "src/lib.rs"

[features]
# GPU tests (headless rendering, ASTC, the windowed present test) need a Vulkan device; they are behind this feature so a
# plain `cargo test` stays seconds-fast. `cargo test -p graphics --features gpu-tests -- --test-threads=1`.
gpu-tests = ["dep:ctt-astcenc"]

[dependencies]
ash = "0.38"
gpu-allocator = { version = "0.27", default-features = false, features = ["vulkan"] }
raw-window-handle = "0.6"
winit = "0.30"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nxrt = { package = "runtime", path = "../runtime" }
nxconfig = { package = "config", path = "../config" }
shaders = { path = "../shaders" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Performance",
    "Win32_Media",
    "Win32_Security",
] }
# ARM's astc-encoder (vendored C++), for the GPU tests only: encodes the ASTC test images and is the CPU reference
# decoder for the GPU decoder.
ctt-astcenc = { version = "0.6", optional = true }

# The windowed present test runs its own event loop on the main thread.
[[test]]
name = "window"
harness = false
required-features = ["gpu-tests"]
